<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Data</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>

    <body>
        <header>
            <h1>Smart Food Waste Management</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('add_data') }}">Add Data</a>
                <a href="{{ url_for('ngos') }}">NGOs</a>
                <a href="{{ url_for('reports') }}">Reports</a>
            </nav>
        </header>
        <main>
            <h2><i class="fas fa-plus-circle" style="color: var(--primary-color); margin-right: 0.5rem;"></i>Add Food
                Data</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <ul class="flashes">
                {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}
            <form method="POST">
                <label for="meal_type">Meal Type:</label>
                <select name="meal_type" id="meal_type" required>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select><br>
                <label for="menu_items">Menu Items:</label>
                <input type="text" name="menu_items" id="menu_items" required><br>
                <label for="cooked">Cooked (kg):</label>
                <input type="number" step="0.01" name="cooked" id="cooked" required><br>
                <label for="consumed">Consumed (kg):</label>
                <input type="number" step="0.01" name="consumed" id="consumed" required><br>
                <label for="people_served">People Served:</label>
                <input type="number" name="people_served" id="people_served" required><br>
                <button type="submit">Add Data</button>
            </form>
        </main>
    </body>

</html>
